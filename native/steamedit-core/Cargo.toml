[package]
name = "steamedit-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "steamedit_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Networking kernel (image download / Steam Web API / AI chat completions).
# `native-tls` uses Windows SChannel so no OpenSSL/cert bundle needs shipping.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
